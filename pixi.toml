[workspace]
name = "unistitch"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"

[pypi-dependencies]
torch = ">=2.7.0"
torchvision = ">=0.22.0"
numpy = ">=1.26.0,<3"
opencv-python = ">=4.10.0"
scikit-image = ">=0.24.0"
imageio = ">=2.34.0"
lmdb = ">=1.4.1"
onnxruntime = ">=1.20.0"
tensorboard = ">=2.16.0"
hydra-core = ">=1.3.0"
jaxtyping = ">=0.2.34"
beartype = ">=0.18.0"
gdown = ">=5.0.0"
pytest = ">=8.0.0"
jupyterlab = ">=4.0.0"
ipykernel = ">=6.29.0"
nbformat = ">=5.10.0"
nbconvert = ">=7.16.0"
matplotlib = ">=3.8.0"
# build/export + tooling (not needed for plain inference/training)
onnx = ">=1.16.0"
onnxscript = ">=0.1.0"
ruff = ">=0.6.0"
ty = "*"

[tasks]
lint = "ruff check Codes keypoint_tool tools"
format = "ruff format Codes keypoint_tool tools"
typecheck = "ty check Codes/train.py Codes/infer.py Codes/dataset.py Codes/checkpoint_utils.py keypoint_tool/onnx_models.py keypoint_tool/onnx_keypoint_tool.py keypoint_tool/export_aliked_descriptor.py tools/build_sequential_pairs.py tools/analyze_matches_poses.py tools/select_pairs.py"
train = "python Codes/train.py"
infer = "python Codes/infer.py"
tensorboard = "tensorboard --logdir outputs"
keypoints = "python keypoint_tool/onnx_keypoint_tool.py"
test = "pytest"
lab = "jupyter lab --no-browser"
